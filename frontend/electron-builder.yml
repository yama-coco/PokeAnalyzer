appId: com.palc.pokeanalyzer
productName: PAL-C
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
extraResources:
  - from: ../backend
    to: backend
    filter:
      - app/**/*
      - models/**/*
      - data/**/*
      - pyproject.toml
win:
  target: nsis
  icon: public/icon.ico
mac:
  target: dmg
  icon: public/icon.icns
linux:
  target: AppImage
  icon: public/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
