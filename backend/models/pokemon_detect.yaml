# ディレクトリ構造:
#   training_data/
#   ├── images/
#   │   ├── train/    # 学習画像 (80%)
#   │   └── val/      # 検証画像 (20%)
#   └── labels/
#       ├── train/    # 学習ラベル (YOLO形式: class_id cx cy w h)
#       └── val/      # 検証ラベル

