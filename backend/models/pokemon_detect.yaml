# YOLOv10 ポケモンアイコン検出 学習設定ファイル
#
# 使い方:
#   cd backend
#   uv sync --extra vision
#   uv run yolo detect train \
#     model=yolov10n.pt \
#     data=models/pokemon_detect.yaml \
#     epochs=100 \
#     imgsz=640 \
#     batch=16 \
#     device=0 \
#     project=models/runs \
#     name=pokemon_v1
#
# 学習済みモデルの配置:
#   cp models/runs/pokemon_v1/weights/best.pt models/pokemon_detect.pt
#
# ディレクトリ構造:
#   training_data/
#   ├── images/
#   │   ├── train/    # 学習画像 (80%)
#   │   └── val/      # 検証画像 (20%)
#   └── labels/
#       ├── train/    # 学習ラベル (YOLO形式: class_id cx cy w h)
#       └── val/      # 検証ラベル

path: ../training_data
train: images/train
val: images/val

# クラス数: レギュレーション M-A 準拠の使用可能ポケモン
# メガシンカ形態を含む
nc: 213

