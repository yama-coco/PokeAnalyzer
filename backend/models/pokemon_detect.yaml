# 使い方:
#   cd backend
#   uv sync --extra vision
#   uv run yolo detect train \
#     model=yolov10n.pt \
#     data=models/pokemon_detect.yaml \
#     epochs=100 \
#     imgsz=640 \
#     batch=16 \
#     device=0 \
#     project=models/runs \
#     name=pokemon_v1
#
# 学習済みモデルの配置:
#   cp models/runs/pokemon_v1/weights/best.pt models/pokemon_detect.pt
